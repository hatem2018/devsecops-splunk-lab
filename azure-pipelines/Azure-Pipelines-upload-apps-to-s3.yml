trigger:
  paths:
    include:
      - splunk-apps/**

pool:
  name: LabAgents

variables:
  - group: LabSecret

steps:
  - checkout: self
    clean: true

  - script: |
      set -euo pipefail

      echo "=== Uploading Splunk apps to AWS S3 ==="

      APPS_DIR="$(System.DefaultWorkingDirectory)/splunk-apps"
      BUCKET="$(AWS_S3_BUCKET)"
      PREFIX="search-app"

      for app in "${APPS_DIR}"/*; do
        if [ -d "$app" ]; then
          appname=$(basename "$app")
          echo "Packaging app: ${appname}"

          tar -czf "${appname}.tgz" -C "${APPS_DIR}" "${appname}"

          echo "Uploading to s3://${BUCKET}/${PREFIX}/${appname}.tgz"

          aws s3 cp "${appname}.tgz" \
            "s3://${BUCKET}/${PREFIX}/${appname}.tgz" \
            --region "$(AWS_REGION)"

          rm -f "${appname}.tgz"
        fi
      done

      echo "=== S3 upload completed ==="
    displayName: 'Upload Splunk Apps to S3'
    env:
      AWS_ACCESS_KEY_ID: $(S3_ACCESS_KEY)
      AWS_SECRET_ACCESS_KEY: $(S3_SECRET_KEY)
      AWS_DEFAULT_REGION: $(AWS_REGION)
