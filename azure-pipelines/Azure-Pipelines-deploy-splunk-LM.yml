trigger: none
pr: none

pool:
  name: LabAgents  # your controller agent pool

variables:
- group: LabSecret
- name: PLAYBOOK_PATH
  value: "infrastructure/ansible/playbooks/45-deploy-splunk-licence-manager.yml"
- name: INVENTORY_PATH
  value: "infrastructure/ansible/inventories/hosts.yml"
- name: ANSIBLE_CONFIG
  value: "infrastructure/ansible/ansible.cfg"




steps:
  - checkout: self


  - script: |
      echo "=== Deploy Splunk Licence Manager on K3s ==="
      cd $(System.DefaultWorkingDirectory)
      ansible-playbook ${PLAYBOOK_PATH} \
      -i $(System.DefaultWorkingDirectory)/infrastructure/ansible/inventories/hosts.yml \
      -e "vault_controller_ssh_pass=$(vault_controller_ssh_pass)"

    displayName: "Run Splunk Licence Manager playbook"

  - script: |
      echo "=== Verify Splunk Licence Manager status ==="
      kubectl get licensemanager -n splunk -o wide
      kubectl get pods -n splunk
    displayName: "Check deployment result"
