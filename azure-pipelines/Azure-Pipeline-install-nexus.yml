trigger: none

pool:
  name: LabAgents

variables:
  - group: LabSecret   # Variable Group contenant vault_ansible_ssh_pass
  - name: PLAYBOOK_PATH
    value: "infrastructure/ansible/playbooks/60-install_nexus.yml"
  - name: INVENTORY_PATH
    value: "infrastructure/ansible/inventories/hosts.yml"
  - name: ANSIBLE_CONFIG
    value: "infrastructure/ansible/ansible.cfg"

steps:
  - checkout: self

  - script: |
      echo "=== RUNNING install_nexus.yml playbook ==="
      cd $(System.DefaultWorkingDirectory)
      ansible-playbook ${PLAYBOOK_PATH} \
      -i $(System.DefaultWorkingDirectory)/infrastructure/ansible/inventories/hosts.yml \
      -e "vault_ansible_ssh_pass=$(vault_ansible_ssh_pass)"
    displayName: "Run Install Nexus playbook"
