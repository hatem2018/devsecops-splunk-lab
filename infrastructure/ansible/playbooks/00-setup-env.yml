---
# ──────────────────────────────────────────────────────────────
# Play 1: Setup base environment on all nodes
# ──────────────────────────────────────────────────────────────
- name: Setup base tools on all nodes
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - gnupg
          - python3-pip
          - nfs-common
        update_cache: true
        state: present

# ──────────────────────────────────────────────────────────────
# Play 2: Prepare the controller (Helm, kubectl, Python deps)
# ──────────────────────────────────────────────────────────────
- name: Install kubectl + helm + Python dependencies on controller
  hosts: controller
  become: true
  gather_facts: false
  tasks:
    - name: Install helm
      shell: |
        set -e
        if ! command -v helm >/dev/null; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
      args:
        executable: /bin/bash

    - name: Ensure ~/.kube exists for devops user
      file:
        path: /home/devops/.kube
        state: directory
        owner: devops
        group: devops
        mode: '0755'

    - name: Install Python dependencies for Kubernetes modules
      pip:
        name:
          - openshift
          - kubernetes
          - pyyaml
          - requests
        state: present

    - name: Verify kubectl version
      shell: kubectl version --client=true
      register: kubectl_version
      changed_when: false

    - name: Show kubectl version
      debug:
        var: kubectl_version.stdout

    - name: Verify cluster connectivity
      become: true
      become_user: devops
      shell: kubectl get nodes -o wide
      register: kubectl_nodes
      changed_when: false

    - name: Show connected nodes
      debug:
        msg: "{{ kubectl_nodes.stdout_lines }}"

# ──────────────────────────────────────────────────────────────
# Play 3: Install Docker on controller (for pipelines + Nexus push)
# ──────────────────────────────────────────────────────────────
- name: Install Docker CE on controller
  hosts: controller
  become: true
  gather_facts: true
  tasks:

    - name: Remove old Docker packages
      apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
        state: absent
        purge: true

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Ensure Docker GPG directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable

    - name: Install Docker engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true
        state: present

    - name: Ensure devops user in docker group
      user:
        name: devops
        append: true
        groups: docker

    - name: Restart Docker
      service:
        name: docker
        state: restarted
        enabled: true

    - name: Verify docker works (hello-world)
      shell: docker run --rm hello-world
      register: docker_test
      changed_when: false

    - name: Show Docker test output
      debug:
        msg: "{{ docker_test.stdout_lines }}"
